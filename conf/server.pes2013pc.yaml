Server:
  AdvertiseIp: "pes.example.com"   # your domain; an IP or "auto" only with Https.Enabled: false
  GameProfile: Pes2013Pc

  Listen:
    Host: 0.0.0.0
    Https: 8446
    Http: 80
    Backlog: 128
    IdleTimeoutSeconds: 300

  Https:
    Enabled: true                 # false = plain HTTP on port 80
    CertificatePath: "certs/fullchain.pem"
    KeyPath: "certs/privkey.pem"

  Captcha:
    Provider: None                # None | Turnstile | HCaptcha | ReCaptcha | Custom
    SiteKey: ""
    SecretKey: ""

  Database:
    Provider: Sqlite              # Sqlite | MySql
    ConnectionString: "Data Source=data/pes2013pc.db"
    AutoCreate: true

  Services:
    - Role: Gate
      Name: Gate
      Gid: 1
      Port: 15010
      MaxPlayers: 1000
    - Role: FdLobby
      Name: FdLobby
      Gid: 2
      Port: 28041
      MaxPlayers: 1000
    - Role: Lobby
      Name: Open Eleven Server
      Gid: 3
      Port: 28042
      MaxPlayers: 1000
    - Role: Menu
      Name: Menu
      Gid: 4
      Port: 28043
      MaxPlayers: 1000
    - Role: Account
      Name: Account
      Gid: 5
      Port: 28044
      MaxPlayers: 1000
    - Role: VdpChat
      Name: VdpChat
      Gid: 6
      Port: 28045
      MaxPlayers: 1000

  Lobbies:
    - Name: Beginner
      MaxPlayers: 100
      Type: open
    - Name: Standard
      MaxPlayers: 100
      Type: open
    - Name: Expert
      MaxPlayers: 100
      Type: open

  Protocol:
    ChallengeCode: "00112233445566778899aabbccddeeff"
    PendingLoginLifetimeSeconds: 300
    PlayerSearchLimit: 100
    BlockedTerms: []
    ServerVersion: "1.0"
    PatchVersion: "1.03"
    DlcVersion: "1.07"
    EulaVersion: "1.0"
    AckUnknownCommands: true
    AckBinaryPackets: true
    EnforceSessionState: true
    EnforceServiceRoles: false
    ShareIdentityByRemoteAddress: false
    EmitUnconfirmedMessages: false

  Debug:
    HexDump: true
    HexDumpMaxBytes: 1024
    PrettyPrintPayloads: true
    LogUnknownCommands: true
    LogOutboundPayloads: true
