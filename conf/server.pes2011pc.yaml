Server:
  AdvertiseIp: "pes.example.com"   # your domain; an IP or "auto" only with Https.Enabled: false
  GameProfile: Pes2011Pc
  LogFile: "logs/pes2011pc.log"

  Listen:
    Host: 0.0.0.0
    Https: 8444
    Http: 80
    Backlog: 128
    IdleTimeoutSeconds: 300

  Https:
    Enabled: true                 # false = plain HTTP on port 80
    CertificatePath: "certs/fullchain.pem"
    KeyPath: "certs/privkey.pem"

  Database:
    Provider: Sqlite              # Sqlite | MySql
    ConnectionString: "Data Source=data/pes2011pc.db"
    AutoCreate: true

  Services:
    - Role: Gate
      Name: Gate
      Gid: 1
      Port: 4010
      MaxPlayers: 1000
    - Role: FdLobby
      Name: FdLobby
      Gid: 2
      Port: 28021
      MaxPlayers: 1000
    - Role: Lobby
      Name: Open Eleven Server
      Gid: 3
      Port: 28022
      MaxPlayers: 1000
    - Role: Menu
      Name: Menu
      Gid: 4
      Port: 28023
      MaxPlayers: 1000
    - Role: Account
      Name: Account
      Gid: 5
      Port: 28024
      MaxPlayers: 1000
    - Role: VdpChat
      Name: VdpChat
      Gid: 6
      Port: 28025
      MaxPlayers: 1000

  Lobbies:
    - Name: Beginner
      MaxPlayers: 100
      Type: open
    - Name: Standard
      MaxPlayers: 100
      Type: open
    - Name: Expert
      MaxPlayers: 100
      Type: open

  Competitions:
    - Id: 1
      Name: OpenEleven Cup
      Category: GOLD              # PLATINUM | GOLD | SILVER | BRONZE
      EntryStart: 2026-10-01T00:00:00Z
      EntryEnd: 2026-12-31T00:00:00Z
      MatchStart: 2026-10-01T00:00:00Z
      MatchEnd: 2027-01-15T00:00:00Z
      End: 2027-01-31T00:00:00Z
      Capacity: 64
      GameTime: TIME_10           # TIME_5 | TIME_10 | TIME_15

  Rank:
    StartRating: 1000
    KNew: 40
    KSettled: 24
    SettledAfterMatches: 30
    WinPoints: 3
    DrawPoints: 1
    CleanSheetBonus: 1
    MaxRatedPerOpponentPerDay: 3
    RequireSameParaHash: true
    PromotePercent: 20
    RelegatePercent: 20
    MinSeasonMatches: 5
    SeasonRatingCarry: 0.75
    HistoryLimit: 30

  # Urls:
  #   - Type: DOWNLOAD
  #     File: dlc/pes2011_dlc.bin
  #     Description: Data pack 1.00

  Protocol:
    ChallengeCode: "00112233445566778899aabbccddeeff"
    PendingLoginLifetimeSeconds: 300
    PlayerSearchLimit: 100
    BlockedTerms: []
    ServerVersion: "1.0"
    PatchVersion: "1.03"
    DlcVersion: "1.07"
    EulaVersion: "1.0"
    AckUnknownCommands: true
    AckBinaryPackets: true
    EnforceSessionState: true
    EnforceServiceRoles: false
    ShareIdentityByRemoteAddress: false
    EmitUnconfirmedMessages: false

  Debug:
    HexDump: true
    HexDumpMaxBytes: 1024
    PrettyPrintPayloads: true
    LogUnknownCommands: true
    LogOutboundPayloads: true
