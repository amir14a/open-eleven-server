<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A main-menu tile: violet floodlit night, a green and gold streak, glossy top, the selected
       tile's lime glow, and a chrome italic 11 (PES 2011, Open Eleven) drawn as paths. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1a4a"/><stop offset=".55" stop-color="#140c22"/><stop offset="1" stop-color="#060509"/>
    </linearGradient>
    <radialGradient id="flood" cx=".85" cy="0" r=".75">
      <stop offset="0" stop-color="#b282f5" stop-opacity=".7"/><stop offset="1" stop-color="#b282f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ee23f" stop-opacity="0"/><stop offset=".45" stop-color="#8ee23f" stop-opacity=".85"/><stop offset="1" stop-color="#e8c547" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#d9dbe1"/><stop offset=".52" stop-color="#75777f"/><stop offset=".7" stop-color="#c9cbd2"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#night)"/>
    <rect width="64" height="64" fill="url(#flood)"/>
    <path d="M-4 52C18 40 38 46 70 30" fill="none" stroke="url(#streak)" stroke-width="2.4"/>
    <path d="M-4 58C22 47 44 52 70 40" fill="none" stroke="url(#streak)" stroke-width="1.2" opacity=".6"/>
    <rect width="64" height="64" fill="url(#gloss)"/>
  </g>
  <g transform="translate(1.6 2.2)" fill="#000" opacity=".65"><path d="M14 50h9l7-36h-9l-9 5 1.5 5 5.9-2z"/><path d="M33 50h9l7-36h-9l-9 5 1.5 5 5.9-2z"/></g>
  <path d="M14 50h9l7-36h-9l-9 5 1.5 5 5.9-2z" fill="url(#chrome)"/>
  <path d="M33 50h9l7-36h-9l-9 5 1.5 5 5.9-2z" fill="url(#chrome)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="12.5" fill="none" stroke="#8ee23f" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="10.5" fill="none" stroke="#8ee23f" stroke-opacity=".3" stroke-width="2"/>
</svg>
